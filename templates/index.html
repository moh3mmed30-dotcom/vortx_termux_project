const enUI={heading:"🧰 AI Toolbox",subtitle:"Choose a tool, enter or paste your text, then run it.",search:"Search tools...",back:"← Back to main menu",run:"Run",running:"Working...",copy:"Copy",copied:"Copied ✓",empty:"Please enter or paste your text first.",failed:"Something went wrong. Please try again.",devTitle:"👨‍💻 Developer: VORTX",devDesc:"Follow the channel, join the chat, or contact the developer directly.",channel:"📢 Telegram Channel",chat:"💬 Chat Group",contact:"✉️ Contact Developer @M_zeuo",themeDay:"☀️ Light mode",themeNight:"🌙 Dark mode"};
const ui=()=>lang==="ar"?arUI:enUI;const toolText=t=>lang==="en"?(EN[t.id]||{}):t;const categoryName=c=>lang==="en"?(CAT_AR[c]||c):c;
function renderCats(){const cs=lang==="en"?["الكل",...new Set(T.map(t=>t.c))]:["الكل",...new Set(T.map(t=>t.c))];$("cats").innerHTML="";cs.forEach(c=>{const b=document.createElement("button");b.className="cat"+(c===cat?" on":"");b.textContent=categoryName(c);b.onclick=()=>{cat=c;renderCats();renderGrid()};$("cats").appendChild(b)})}
function renderGrid(){const q=$("search").value.trim().toLocaleLowerCase();$("grid").innerHTML="";T.filter(t=>{const x=toolText(t);return(cat==="الكل"||t.c===cat)&&(!q||(x.n+" "+x.d+t.n+t.d).toLocaleLowerCase().includes(q))}).forEach(t=>{const x=toolText(t);const b=document.createElement("button");b.className="tool";const e=document.createElement("span");e.className="e";e.textContent=t.e;const n=document.createElement("b");n.textContent=x.n;const s=document.createElement("small");s.textContent=x.d;b.append(e,n,s);b.onclick=()=>openTool(t);$("grid").appendChild(b)})}
function openTool(t){cur=t;const x=toolText(t);$("home").style.display="none";$("panel").classList.add("show");$("pt").textContent=t.e+" "+x.n;$("pd").textContent=x.d;$("inp").placeholder=x.ph;$("inp").value="";const o=$("opt");o.innerHTML="";if(x.o){x.o.forEach(v=>{const op=document.createElement("option");op.textContent=v;o.appendChild(op)});o.style.display="block"}else o.style.display="none";$("out").classList.remove("show");$("out").textContent="";$("err").style.display="none";$("copy").style.display="none";$("copy").textContent=ui().copy;window.scrollTo({top:0,behavior:"smooth"})}
function goHome(){if(ctl)ctl.abort();$("panel").classList.remove("show");$("home").style.display="block";cur=null;window.scrollTo({top:0,behavior:"smooth"})}
$("back").onclick=goHome;$("search").oninput=renderGrid;
function showErr(m){$("err").textContent=m;$("err").style.display="block"}
$("run").onclick=async()=>{if(!cur)return;const txt=$("inp").value.trim();$("err").style.display="none";if(!txt){showErr(ui().empty);return}const x=toolText(cur);const opt=cur.o?$("opt").value:"";const task=(x.p||cur.p)(opt);const language=lang==="en"?"English":"Arabic";const prompt=`Task: ${task}\n\nOutput language: ${language}. Return ONLY the requested result. Do not add an introduction, notes, explanations about your process, disclaimers, or follow-up suggestions. Preserve the user's original content and intent.\n\nUser text:\n${txt}`;
ctl=new AbortController();$("run").disabled=true;$("run").textContent=ui().running;$("out").classList.add("show");$("out").textContent="";try{const r=await fetch("/api/convert",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:prompt}),signal:ctl.signal});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||ui().failed);$("out").textContent=data.answer||"";$("copy").style.display="block";if(!$("out").textContent)throw new Error(ui().failed)}catch(e){if(e.name!=="AbortError")showErr(e.message||ui().failed);if(!$("out").textContent)$("out").classList.remove("show")}finally{$("run").disabled=false;$("run").textContent=ui().run}};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("out").textContent);$("copy").textContent=ui().copied;setTimeout(()=>$("copy").textContent=ui().copy,1300)}catch(e){const r=document.createRange();r.selectNodeContents($("out"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
function updateLanguage(){const u=ui();document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=lang==="ar"?"VORTX | صندوق أدوات الذكاء الاصطناعي":"VORTX | AI Toolbox";$("heading").textContent=u.heading;$("subtitle").textContent=u.subtitle;$("search").placeholder=u.search;$("search").setAttribute("aria-label",u.search);$("back").textContent=u.back;$("devTitle").textContent=u.devTitle;$("devDesc").textContent=u.devDesc;$("channelLink").textContent=u.channel;$("chatLink").textContent=u.chat;$("contactLink").textContent=u.contact;$("langBtn").textContent=lang==="ar"?"English":"العربية";updateThemeLabel();renderCats();renderGrid();if(cur){$("pt").textContent=cur.e+" "+toolText(cur).n;$("pd").textContent=toolText(cur).d;const old=$("opt").value;const o=$("opt");o.innerHTML="";const x=toolText(cur);if(x.o){x.o.forEach(v=>{const op=document.createElement("option");op.textContent=v;o.appendChild(op)});o.style.display="block";if([...o.options].some(z=>z.textContent===old))o.value=old}else o.style.display="none"}if($("out").classList.contains("show"))$("copy").textContent=u.copy}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";localStorage.setItem("vortx-lang",lang);updateLanguage()};
function updateThemeLabel(){const dark=document.documentElement.dataset.theme==="dark";$("themeBtn").textContent=dark?ui().themeDay:ui().themeNight}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("vortx-theme",t);updateThemeLabel()}
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
lang=localStorage.getItem("vortx-lang")||"ar";setTheme(localStorage.getItem("vortx-theme")||"light");updateLanguage();
</script></main></body></html>
